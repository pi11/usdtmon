[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "usdtmon"
version = "0.1.0"
description = "Read-only Telegram bot that notifies users about incoming USDT transfers on Ethereum and Tron"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0,<23",
    "tortoise-orm[asyncpg]>=1.1,<2",
    "httpx>=0.27,<1",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
usdtmon = "usdtmon.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.tortoise]
tortoise_orm = "usdtmon.db.TORTOISE_ORM"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires a PostgreSQL database (TEST_DATABASE_URL)"]
filterwarnings = ["ignore:.*retry_after.*will be of type:DeprecationWarning", "ignore:.*retry_after.*will be of type:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/usdtmon/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["usdtmon"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["src/usdtmon/migrations/"]

[[tool.mypy.overrides]]
module = ["Crypto.*", "respx.*"]
ignore_missing_imports = true
